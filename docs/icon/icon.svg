<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>MoneyWatcher</title>

  <!-- Dos tintas planas y nada más: ni degradados, ni brillos, ni reflejos. Un
       icono de Dock se ve casi siempre a 32 px, y a ese tamaño lo único que
       sobrevive es la silueta; todo lo demás es ruido que además envejece mal. -->
  <rect width="1024" height="1024" rx="228" fill="#14161a"/>

  <!-- El ojo es la forma que hace reconocible el icono: dos arcos del mismo
       grosor y ya. -->
  <path d="M 212 512 Q 512 236 812 512 Q 512 788 212 512 Z"
        fill="none" stroke="#f2f3f5" stroke-width="48" stroke-linejoin="round"/>

  <!-- El iris es un disco macizo, así que a tamaño pequeño se lee como pupila. -->
  <circle cx="512" cy="512" r="140" fill="#f2f3f5"/>

  <!-- Euro calado sobre el iris: a tamaño grande dice de qué va la aplicación.
       Se dibuja con un arco y dos barras en vez de con texto para no depender
       de ninguna fuente instalada. -->
  <g stroke="#14161a" fill="none" stroke-width="30" stroke-linecap="round">
    <path d="M 570 458 A 74 74 0 1 0 570 566"/>
    <path d="M 418 494 H 556"/>
    <path d="M 418 532 H 540"/>
  </g>
</svg>
