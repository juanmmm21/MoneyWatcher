[package]
name = "moneywatcher-core"
description = "Local-first personal finance engine: statement parsing, categorization rules and analytics."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
csv = "1.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }
